<div class="receipt-stack"><section class="panel bill"><h2>归档印记</h2>{% if manifest %}<dl><dt>结果摘要</dt><dd class="digest">{{ manifest.result_sha256 }}</dd><dt>耗时</dt><dd>{{ manifest.elapsed_ms }} ms</dd></dl>{% else %}<p>样例卷尚未归档。</p>{% endif %}<button id="commit" type="button" data-key="{{ key or '' }}" data-sample="{{ sample }}" data-view="runs">{{ '按原件复算' if key else '归还称签归档' }}</button><output id="message" role="status"></output></section><section class="panel stub"><h2>在柜卷联</h2><ul>{% for row in history %}<li><a href="{{ url_for('roast_station.counter',view='runs',run=row.id) }}">{{ row.id[:12] }} · {{ row.created_at }}</a></li>{% else %}<li>暂无入柜卷联。</li>{% endfor %}</ul></section></div>
